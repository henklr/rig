name: lint

# Weekly as well, against whatever Arch ships by then: Hyprland can change its
# config language in a release, and this should fail before your machine does.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - run: bash test/lint.sh
