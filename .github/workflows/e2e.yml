name: e2e

# Installs the whole system from the real Arch ISO in a VM. Slow, so it only
# runs when something that affects the install changes, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - install.sh
      - install/**
      - lib/**
      - packages/**
      - config/**
      - shell/**
      - test/e2e.sh
      - .github/workflows/e2e.yml

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Allow access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf genisoimage socat

      - name: Install from the ISO, boot and check
        run: test/e2e.sh
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            e2e/*.png
            e2e/*.log
            e2e/*.txt
