$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.local/share/wallpapers/swirl_blur.jpg
    color = rgb(20, 20, 22)
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgb(51, 204, 255)
    check_color = rgb(51, 204, 255)
    fail_color = rgb(204, 70, 70)
    font_color = rgb(230, 230, 230)
    font_family = $font
    fade_on_empty = false
    rounding = 0
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    color = rgb(230, 230, 230)
    position = 0, 80
    halign = center
    valign = center
}
